name: HoneyGate Python Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-honeygate:
    name: Run python3 test_honeygate.py
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute integration and security tests
        run: python3 test_honeygate.py
